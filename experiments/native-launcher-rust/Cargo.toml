[package]
name = "goal-devin-rust"
version = "0.1.0"
edition = "2021"
authors = ["Kartik Kabadi"]
license = "MIT"
description = "R1B Rust native-launcher candidate and optional companion TUI for Goal Devin"

[dependencies]
anyhow = "=1.0.95"
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.5.37", features = ["derive"] }
hex = "=0.4.3"
libc = "=0.2.169"
rand = "=0.8.5"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.133"
thiserror = "=1.0.69"
regex = "=1.10.6"
signal-hook = "=0.3.17"

# Companion-only dependencies; the baseline candidate does not require them at runtime.
# They are intentionally left out of the default feature set to keep MSRV low.
ratatui = { version = "=0.27.0", optional = true }
crossterm = { version = "=0.27.0", optional = true }
unicode-segmentation = { version = "=1.10.1", optional = true }

[dev-dependencies]
tempfile = "=3.10.1"

[features]
companion = ["ratatui", "crossterm", "unicode-segmentation"]

[[bin]]
name = "goal-devin-dev"
path = "src/bin/goal-devin-dev.rs"

[[bin]]
name = "goal-devin-hook"
path = "src/bin/goal-devin-hook.rs"

[[bin]]
name = "goal-devin-sidecar"
path = "src/bin/goal-devin-sidecar.rs"

[[bin]]
name = "goal-devin-companion"
path = "src/bin/goal-devin-companion.rs"
required-features = ["companion"]
